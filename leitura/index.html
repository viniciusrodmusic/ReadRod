<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="./style.css" rel="stylesheet" type="text/css">
    <link rel="stylesheet" href="../fontawesome-free-6.7.2-web/css/all.css" type="text/css">

    <!--Fonts-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  
        <!-- MONTSERRAT -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">    
        <!-- ROBOTO SERIF -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Serif:ital,opsz,wght@0,8..144,100..900;1,8..144,100..900&display=swap" rel="stylesheet">
        <!-- DM SERIF DISPLAY -->
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
        <!-- Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <script src="./script.js" defer></script>
    <title>Leitura</title>
</head>
<body>

    <header>
        <h1 class="chapter"></h1>

        <input type="checkbox" id="menu-toggle">

        <!-- MENU HAMBÚRGUER -->
        <label for="menu-toggle" class="menu-icon">
            <div class="linha"></div>
            <div class="linha"></div>
            <div class="linha"></div>
        </label>

        
        
    </header>
    



    <main>
        <!-- O QUE APARECE QUANDO O MENU HAMBÚRGUER É PRESSIONADO -->
        <div class="overlay overlay-disable">

            <nav class="nav-overlay">
                <ul class="options-list-overlay">

                    <li class="options-overlay" id="font-size-option">
                        <h3>Letra:</h3>
                        <div class="font-size-buttons">
                            <button type="button">-</button>
                            <p>Aa</p>
                            <button type="button">+</button>
                        </div>
                    </li>
                    <hr>
                    <li class="options-overlay" id="theme-option">
                        <h3>Tema:</h3>
                        <button>
                            <i class="fa-solid fa-moon theme-icon"></i>
                        </button>
                    </li>
                </ul>
            </nav>
        </div>

        <pre class="book-content">
           

        </pre>


                <!-- BOTÕES PARA TROCAR DE LIVRO -->
        <i class="fa-solid fa-square-caret-right see-books-button disable" id="previous-book-button"></i>
        <i class="fa-solid fa-square-caret-right see-books-button" id="next-book-button"></i>

    </main>


    <footer>
        aaaa
    </footer>

    
</body>
</html>
